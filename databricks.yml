bundle:
  name: booking_summary

include:
  - resources/*.yml

variables:

  catalog:
    description: The catalog the notebook writes into
    default: ctl_training_dev

  schema:
    description: The schema the notebook writes into; one per target, so a
      prod deployment can never overwrite a dev table
    default: m7_dev

  # Pinned to the training workspace's one all-purpose cluster,
  # Training_Cluster. The id is workspace-specific — the same trade-off
  # Module 4 accepted, for the same reason: the credential may not create
  # clusters, and a permission outranks a preference.
  cluster_id:
    description: Id of the existing all-purpose cluster the task runs on
    default: 0318-031919-b3fa4xtr

targets:

  dev:
    mode: development
    default: true
    variables:
      schema: m7_dev
    permissions:
      - user_name: worapole@ais.co.th
        level: CAN_MANAGE
      - user_name: chalanta@ais.co.th
        level: CAN_MANAGE
      - user_name: chayatha@ais.co.th
        level: CAN_MANAGE
      - user_name: sriamarm@ais.co.th
        level: CAN_MANAGE
      - user_name: jirapopg@ais.co.th
        level: CAN_MANAGE
      - group_name: BII_TRAIN_USER
        level: CAN_VIEW

  prod:
    mode: production
    # Deploys to prod are refused from any other branch, so the only path
    # into prod is a merge (slide 38).
    git:
      branch: main
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: m7_prod
    permissions:
      - user_name: worapole@ais.co.th
        level: CAN_MANAGE
      - user_name: chalanta@ais.co.th
        level: CAN_MANAGE
      - user_name: chayatha@ais.co.th
        level: CAN_MANAGE
      - user_name: sriamarm@ais.co.th
        level: CAN_MANAGE
      - user_name: jirapopg@ais.co.th
        level: CAN_MANAGE
      - group_name: BII_TRAIN_USER
        level: CAN_VIEW
